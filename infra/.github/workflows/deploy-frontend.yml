name: 🌐 Deploy Frontend (Development)

on:
  workflow_run:
    workflows: ["🔍 Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'

jobs:
  # ================================
  # PRE-DEPLOYMENT VALIDATION
  # ================================
  pre-deployment:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      deployment-env: ${{ steps.set-env.outputs.environment }}
      s3-bucket: ${{ steps.set-env.outputs.s3-bucket }}
      cloudfront-id: ${{ steps.set-env.outputs.cloudfront-id }}
      aws-role: ${{ steps.set-env.outputs.aws-role }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="development"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          
          case $ENV in
            "development")
              echo "s3-bucket=${{ secrets.S3_BUCKET_DEV }}" >> $GITHUB_OUTPUT
              echo "cloudfront-id=${{ secrets.CLOUDFRONT_ID_DEV }}" >> $GITHUB_OUTPUT
              echo "aws-role=${{ secrets.AWS_ROLE_ARN_DEV }}" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "s3-bucket=${{ secrets.S3_BUCKET_STAGING }}" >> $GITHUB_OUTPUT
              echo "cloudfront-id=${{ secrets.CLOUDFRONT_ID_STAGING }}" >> $GITHUB_OUTPUT
              echo "aws-role=${{ secrets.AWS_ROLE_ARN_STAGING }}" >> $GITHUB_OUTPUT
              ;;
          esac
          
      - name: ✅ Validate deployment target
        run: |
          echo "🎯 Deployment Environment: ${{ steps.set-env.outputs.environment }}"
          echo "🪣 S3 Bucket: ${{ steps.set-env.outputs.s3-bucket }}"
          echo "🌐 CloudFront ID: ${{ steps.set-env.outputs.cloudfront-id }}"
          echo "🔐 AWS Role: ${{ steps.set-env.outputs.aws-role }}"

  # ================================
  # BUILD & PACKAGE
  # ================================
  build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: pre-deployment
    defaults:
      run:
        working-directory: app/frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🔧 Configure build environment
        run: |
          echo "🔧 Configuring build for environment: ${{ needs.pre-deployment.outputs.deployment-env }}"
          
          # Set environment-specific variables
          case "${{ needs.pre-deployment.outputs.deployment-env }}" in
            "development")
              echo "VITE_API_URL=https://api-dev.tradepulse.ai" >> .env.production
              echo "VITE_ENV=development" >> .env.production
              ;;
            "staging")
              echo "VITE_API_URL=https://api-staging.tradepulse.ai" >> .env.production
              echo "VITE_ENV=staging" >> .env.production
              ;;
          esac
          
          echo "📄 Build configuration:"
          cat .env.production || echo "No .env.production file"
          
      - name: 🏗️ Build application
        run: |
          echo "🏗️ Building Astro application..."
          npm run build:prod
          
          # Verify build output
          echo "📊 Build output size:"
          du -sh dist/
          
          echo "📁 Build contents:"
          find dist/ -type f -name "*.html" -o -name "*.js" -o -name "*.css" | head -10
          
      - name: 🧪 Test build integrity
        run: |
          echo "🧪 Testing build integrity..."
          
          # Check if main files exist
          if [[ ! -f "dist/index.html" ]]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi
          
          # Check for critical assets
          if [[ ! -d "dist/_astro" ]]; then
            echo "❌ Astro assets directory not found"
            exit 1
          fi
          
          echo "✅ Build integrity verified"
          
      - name: 🗜️ Optimize build
        run: |
          echo "🗜️ Optimizing build output..."
          
          # Remove source maps in production
          if [[ "${{ needs.pre-deployment.outputs.deployment-env }}" == "production" ]]; then
            find dist/ -name "*.map" -delete
            echo "🗑️ Removed source maps for production"
          fi
          
          # Compress large files
          find dist/ -type f -size +1M -name "*.js" -o -name "*.css" | while read file; do
            echo "🗜️ Large file found: $file ($(du -h "$file" | cut -f1))"
          done
          
      - name: 📊 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: app/frontend/dist/
          retention-days: 30

  # ================================
  # DEPLOY
  # ================================
  deploy:
    name: 🚀 Deploy to ${{ needs.pre-deployment.outputs.deployment-env }}
    runs-on: ubuntu-latest
    needs: [pre-deployment, build]
    environment: ${{ needs.pre-deployment.outputs.deployment-env }}
    
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: ./dist
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 📤 Deploy to S3
        run: |
          echo "📤 Deploying to S3 bucket: ${{ needs.pre-deployment.outputs.s3-bucket }}"
          
          # Sync with optimized settings
          aws s3 sync ./dist s3://${{ needs.pre-deployment.outputs.s3-bucket }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json"
            
          # Upload HTML files with shorter cache
          aws s3 sync ./dist s3://${{ needs.pre-deployment.outputs.s3-bucket }} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"
            
          echo "✅ S3 deployment completed"
          
      - name: 🌐 Invalidate CloudFront
        run: |
          echo "🌐 Invalidating CloudFront distribution: ${{ needs.pre-deployment.outputs.cloudfront-id }}"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ needs.pre-deployment.outputs.cloudfront-id }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
            
          echo "🔄 Invalidation created: $INVALIDATION_ID"
          
          # Wait for invalidation to complete (optional, can be removed for faster deployments)
          echo "⏳ Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ needs.pre-deployment.outputs.cloudfront-id }}" \
            --id "$INVALIDATION_ID"
            
          echo "✅ CloudFront invalidation completed"

  # ================================
  # POST-DEPLOYMENT VALIDATION
  # ================================
  validate:
    name: ✅ Post-deployment Validation
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy]
    
    steps:
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 🔍 S3 deployment verification
        run: |
          echo "🔍 Verifying S3 deployment..."
          
          # Check if key files exist in S3
          aws s3 ls s3://${{ needs.pre-deployment.outputs.s3-bucket }}/index.html
          
          if [[ $? -eq 0 ]]; then
            echo "✅ index.html found in S3"
          else
            echo "❌ index.html not found in S3"
            exit 1
          fi
          
          # Get deployment info
          OBJECT_COUNT=$(aws s3 ls s3://${{ needs.pre-deployment.outputs.s3-bucket }} --recursive | wc -l)
          echo "📊 Total objects in S3: $OBJECT_COUNT"
          
      - name: 🌐 CloudFront health check
        run: |
          echo "🌐 Testing CloudFront distribution..."
          
          # Get distribution domain name
          DOMAIN_NAME=$(aws cloudfront get-distribution \
            --id "${{ needs.pre-deployment.outputs.cloudfront-id }}" \
            --query 'Distribution.DomainName' \
            --output text)
            
          echo "🔗 Distribution domain: $DOMAIN_NAME"
          
          # Test main page
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$DOMAIN_NAME/" || echo "000")
          
          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "✅ Frontend health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Frontend health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          
      - name: 🚀 Performance check
        run: |
          echo "🚀 Basic performance validation..."
          
          # Get distribution domain name
          DOMAIN_NAME=$(aws cloudfront get-distribution \
            --id "${{ needs.pre-deployment.outputs.cloudfront-id }}" \
            --query 'Distribution.DomainName' \
            --output text)
            
          # Measure response time
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" "https://$DOMAIN_NAME/" || echo "0")
          
          echo "⏱️ Response time: ${RESPONSE_TIME}s"
          
          # Check if response time is reasonable (< 3 seconds)
          if (( $(echo "$RESPONSE_TIME < 3.0" | bc -l) )); then
            echo "✅ Performance check passed"
          else
            echo "⚠️ Slow response time detected"
          fi

  # ================================
  # NOTIFICATION
  # ================================
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy, validate]
    if: always()
    
    steps:
      - name: 📢 Deployment notification
        run: |
          if [[ "${{ needs.validate.result }}" == "success" ]]; then
            echo "🎉 Frontend deployment to ${{ needs.pre-deployment.outputs.deployment-env }} completed successfully!"
            echo "🌐 S3 Bucket: ${{ needs.pre-deployment.outputs.s3-bucket }}"
            echo "🌐 CloudFront ID: ${{ needs.pre-deployment.outputs.cloudfront-id }}"
            echo "✅ Commit: ${{ github.sha }}"
            echo "✅ Environment: ${{ needs.pre-deployment.outputs.deployment-env }}"
          else
            echo "❌ Frontend deployment to ${{ needs.pre-deployment.outputs.deployment-env }} failed!"
            echo "🔍 Check the logs for more details"
            exit 1
          fi
