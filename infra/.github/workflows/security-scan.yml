name: 🛡️ Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  # ================================
  # DEPENDENCY SCANNING
  # ================================
  dependency-scan:
    name: 🔍 Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 🔒 Python dependency security check (Safety)
        working-directory: app/backend
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
          safety check --short-report
        continue-on-error: true
        
      - name: 🔒 Python dependency audit (pip-audit)
        working-directory: app/backend
        run: |
          pip install pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true
        
      - name: 🔒 Node.js dependency audit
        working-directory: app/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
        
      - name: 🔒 Snyk dependency scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app/backend/requirements.txt --json-file-output=snyk-python-report.json
        continue-on-error: true
        
      - name: 🔒 Snyk Node.js scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=app/frontend/package.json --json-file-output=snyk-node-report.json
        continue-on-error: true
        
      - name: 📊 Upload dependency scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-reports-${{ github.sha }}
          path: |
            app/backend/safety-report.json
            app/backend/pip-audit-report.json
            app/frontend/npm-audit-report.json
            snyk-python-report.json
            snyk-node-report.json
          retention-days: 90

  # ================================
  # STATIC APPLICATION SECURITY TESTING (SAST)
  # ================================
  sast-scan:
    name: 🔍 Static Application Security Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: 🛡️ Python security scan (Bandit)
        working-directory: app/backend
        run: |
          pip install bandit[toml]
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt -o bandit-report.txt || true
          
          echo "📊 Bandit security scan results:"
          head -20 bandit-report.txt
        continue-on-error: true
        
      - name: 🛡️ Python security scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/django
            p/flask
            p/fastapi
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
        
      - name: 🛡️ JavaScript/TypeScript security scan (ESLint Security)
        working-directory: app/frontend
        run: |
          npm ci
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-security-report.json || true
          npx eslint . --ext .js,.jsx,.ts,.tsx
        continue-on-error: true
        
      - name: 🛡️ Infrastructure security scan (tfsec)
        working-directory: infra/terraform
        run: |
          # Install tfsec
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          
          # Scan all environments
          for env in envs/*/; do
            if [[ -d "$env" ]]; then
              echo "🔍 Scanning $env"
              tfsec "$env" --format json --out "tfsec-$(basename "$env")-report.json" || true
              tfsec "$env" --format default
            fi
          done
        continue-on-error: true
        
      - name: 📊 Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-scan-reports-${{ github.sha }}
          path: |
            app/backend/bandit-report.json
            app/backend/bandit-report.txt
            app/frontend/eslint-security-report.json
            infra/terraform/tfsec-*-report.json
            results.sarif
          retention-days: 90
          
      - name: 📤 Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ================================
  # SECRETS SCANNING
  # ================================
  secrets-scan:
    name: 🔐 Secrets Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
          
      - name: 🔍 GitLeaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
        continue-on-error: true
        
      - name: 🔍 TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified --json --output=trufflehog-report.json
        continue-on-error: true
        
      - name: 📊 Upload secrets scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-scan-reports-${{ github.sha }}
          path: |
            results.sarif
            trufflehog-report.json
          retention-days: 90

  # ================================
  # CONTAINER SECURITY SCANNING
  # ================================
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'  # Skip on PRs to save resources
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 🏗️ Build test container (Backend)
        working-directory: app/backend
        run: |
          # Create a test Dockerfile if it doesn't exist
          cat > Dockerfile.security-test << 'EOF'
          FROM python:3.13-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          CMD ["python", "main.py"]
          EOF
          
          docker build -f Dockerfile.security-test -t tradepulse-backend:security-test .
          
      - name: 🔍 Trivy container scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tradepulse-backend:security-test
          format: 'sarif'
          output: 'backend-trivy-results.sarif'
        continue-on-error: true
        
      - name: 🔍 Grype container scan (Backend)
        uses: anchore/scan-action@v3
        with:
          image: tradepulse-backend:security-test
          fail-build: false
          output-format: sarif
          output-file: backend-grype-results.sarif
        continue-on-error: true
        
      - name: 📊 Upload container scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-scan-reports-${{ github.sha }}
          path: |
            backend-trivy-results.sarif
            backend-grype-results.sarif
          retention-days: 90
          
      - name: 📤 Upload container SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend-trivy-results.sarif

  # ================================
  # INFRASTRUCTURE SECURITY SCANNING
  # ================================
  infrastructure-scan:
    name: 🏗️ Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🛡️ Checkov infrastructure scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
          
      - name: 🛡️ Terrascan infrastructure scan
        uses: tenable/terrascan-action@main
        with:
          iac_type: 'terraform'
          iac_dir: 'infra/terraform'
          policy_type: 'aws'
          only_warn: true
          sarif_upload: true
          
      - name: 🛡️ KICS infrastructure scan
        uses: checkmarx/kics-github-action@master
        with:
          path: 'infra/terraform'
          output_path: kics-results
          platform_type: terraform
          output_formats: 'sarif'
          fail_on: high
        continue-on-error: true
        
      - name: 📊 Upload infrastructure scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-scan-reports-${{ github.sha }}
          path: |
            checkov-results.sarif
            results.sarif
            kics-results/
          retention-days: 90
          
      - name: 📤 Upload infrastructure SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif

  # ================================
  # API SECURITY TESTING
  # ================================
  api-security-test:
    name: 🔌 API Security Testing
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'  # Skip on PRs
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: 🚀 Start test backend
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          python main.py &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          
          # Wait for backend to start
          sleep 10
          
          # Test if backend is running
          curl -f http://localhost:9002/health || exit 1
        
      - name: 🛡️ OWASP ZAP API security scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:9002'
          format: openapi
          cmd_options: '-a -j -T 5'
        continue-on-error: true
        
      - name: 🛡️ Nuclei API security scan
        uses: projectdiscovery/nuclei-action@main
        with:
          target: http://localhost:9002
          templates: nuclei-templates/http/
          output: nuclei-results.txt
        continue-on-error: true
        
      - name: 🛑 Stop test backend
        if: always()
        run: |
          if [[ -n "$BACKEND_PID" ]]; then
            kill $BACKEND_PID || true
          fi
          
      - name: 📊 Upload API security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-security-reports-${{ github.sha }}
          path: |
            report_html.html
            report_json.json
            nuclei-results.txt
          retention-days: 90

  # ================================
  # SECURITY SUMMARY
  # ================================
  security-summary:
    name: 📊 Security Scan Summary
    runs-on: ubuntu-latest
    needs: 
      - dependency-scan
      - sast-scan
      - secrets-scan
      - container-scan
      - infrastructure-scan
      - api-security-test
    if: always()
    
    steps:
      - name: 📥 Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports/
          
      - name: 📊 Generate security summary
        run: |
          echo "# 🛡️ Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Scan Date:** $(date -u)" >> security-summary.md
          echo "**Commit:** ${{ github.sha }}" >> security-summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "## 📋 Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          
          # Check each scan result
          scans=(
            "dependency-scan:🔍 Dependency Security:${{ needs.dependency-scan.result }}"
            "sast-scan:🛡️ Static Analysis:${{ needs.sast-scan.result }}"
            "secrets-scan:🔐 Secrets Detection:${{ needs.secrets-scan.result }}"
            "container-scan:🐳 Container Security:${{ needs.container-scan.result }}"
            "infrastructure-scan:🏗️ Infrastructure Security:${{ needs.infrastructure-scan.result }}"
            "api-security-test:🔌 API Security:${{ needs.api-security-test.result }}"
          )
          
          for scan in "${scans[@]}"; do
            IFS=':' read -r scan_name scan_title scan_result <<< "$scan"
            
            case $scan_result in
              "success")
                echo "- ✅ $scan_title: **PASSED**" >> security-summary.md
                ;;
              "failure")
                echo "- ❌ $scan_title: **FAILED**" >> security-summary.md
                ;;
              "cancelled"|"skipped")
                echo "- ⏭️ $scan_title: **SKIPPED**" >> security-summary.md
                ;;
              *)
                echo "- ❓ $scan_title: **UNKNOWN**" >> security-summary.md
                ;;
            esac
          done
          
          echo "" >> security-summary.md
          echo "## 📁 Detailed Reports" >> security-summary.md
          echo "" >> security-summary.md
          echo "Detailed security reports are available in the workflow artifacts." >> security-summary.md
          echo "" >> security-summary.md
          
          # Count total issues (if we can parse JSON reports)
          echo "## 🔢 Issue Summary" >> security-summary.md
          echo "" >> security-summary.md
          
          # This would require parsing the JSON reports from each tool
          echo "- **High Priority:** Review failed scans immediately" >> security-summary.md
          echo "- **Medium Priority:** Review warnings in next sprint" >> security-summary.md
          echo "- **Low Priority:** Address during regular maintenance" >> security-summary.md
          
          echo "" >> security-summary.md
          echo "---" >> security-summary.md
          echo "*Generated by TradePulse.AI Security Pipeline*" >> security-summary.md
          
          # Display summary
          cat security-summary.md
          
      - name: 💬 Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
            
      - name: 📊 Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-${{ github.sha }}
          path: security-summary.md
          retention-days: 90
