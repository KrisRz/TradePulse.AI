name: 🏗️ Deploy Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      terraform_action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write  # For PR comments

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: '1.6.0'

jobs:
  # ================================
  # PRE-DEPLOYMENT VALIDATION
  # ================================
  pre-deployment:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform-dir: ${{ steps.set-env.outputs.terraform-dir }}
      aws-role: ${{ steps.set-env.outputs.aws-role }}
      terraform-action: ${{ steps.set-env.outputs.terraform-action }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            ACTION="${{ github.event.inputs.terraform_action }}"
          else
            ENV="development"
            ACTION="apply"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "terraform-action=$ACTION" >> $GITHUB_OUTPUT
          echo "terraform-dir=infra/terraform/envs/$ENV" >> $GITHUB_OUTPUT
          
          case $ENV in
            "development")
              echo "aws-role=${{ secrets.AWS_ROLE_ARN_DEV }}" >> $GITHUB_OUTPUT
              ;;
            "staging")
              echo "aws-role=${{ secrets.AWS_ROLE_ARN_STAGING }}" >> $GITHUB_OUTPUT
              ;;
            "production")
              echo "aws-role=${{ secrets.AWS_ROLE_ARN_PROD }}" >> $GITHUB_OUTPUT
              ;;
          esac
          
      - name: ✅ Validate deployment target
        run: |
          echo "🎯 Environment: ${{ steps.set-env.outputs.environment }}"
          echo "🔧 Terraform Directory: ${{ steps.set-env.outputs.terraform-dir }}"
          echo "⚡ Action: ${{ steps.set-env.outputs.terraform-action }}"
          echo "🔐 AWS Role: ${{ steps.set-env.outputs.aws-role }}"
          
          # Check if terraform directory exists
          if [[ ! -d "${{ steps.set-env.outputs.terraform-dir }}" ]]; then
            echo "❌ Terraform directory does not exist: ${{ steps.set-env.outputs.terraform-dir }}"
            exit 1
          fi
          
          echo "✅ Pre-deployment validation passed"

  # ================================
  # TERRAFORM VALIDATION
  # ================================
  terraform-validate:
    name: 🔍 Terraform Validation
    runs-on: ubuntu-latest
    needs: pre-deployment
    defaults:
      run:
        working-directory: ${{ needs.pre-deployment.outputs.terraform-dir }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 🔍 Terraform Format Check
        run: |
          echo "🔍 Checking Terraform formatting..."
          terraform fmt -check -recursive
          
      - name: ⚙️ Terraform Init
        run: |
          echo "⚙️ Initializing Terraform..."
          terraform init -input=false
          
      - name: ✅ Terraform Validate
        run: |
          echo "✅ Validating Terraform configuration..."
          terraform validate
          
      - name: 🛡️ Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ needs.pre-deployment.outputs.terraform-dir }}
          soft_fail: true
          format: json
          
      - name: 📊 Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-validation-${{ needs.pre-deployment.outputs.environment }}
          path: |
            tfsec-report.json
          retention-days: 30

  # ================================
  # TERRAFORM PLAN
  # ================================
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: [pre-deployment, terraform-validate]
    defaults:
      run:
        working-directory: ${{ needs.pre-deployment.outputs.terraform-dir }}
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: ⚙️ Terraform Init
        run: terraform init -input=false
        
      - name: 📋 Terraform Plan
        id: plan
        run: |
          echo "📋 Creating Terraform plan..."
          
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan \
            -lock-timeout=300s
            
          # Store exit code for later use
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          
          # Generate human-readable plan
          terraform show -no-color tfplan > tfplan.txt
          
          echo "📊 Plan summary:"
          grep -E "Plan:|No changes" tfplan.txt || echo "Plan created successfully"
          
      - name: 💰 Cost estimation (Infracost)
        if: steps.plan.outputs.exitcode == 2
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          
      - name: 💰 Generate cost estimate
        if: steps.plan.outputs.exitcode == 2
        run: |
          if [[ -n "${{ secrets.INFRACOST_API_KEY }}" ]]; then
            echo "💰 Generating cost estimate..."
            infracost breakdown \
              --path=tfplan \
              --format=json \
              --out-file=infracost.json
              
            infracost output \
              --path=infracost.json \
              --format=table \
              --out-file=cost-estimate.txt
              
            echo "💰 Cost estimate:"
            cat cost-estimate.txt
          else
            echo "ℹ️ Infracost API key not configured, skipping cost estimation"
          fi
          
      - name: 📊 Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.pre-deployment.outputs.environment }}
          path: |
            ${{ needs.pre-deployment.outputs.terraform-dir }}/tfplan
            ${{ needs.pre-deployment.outputs.terraform-dir }}/tfplan.txt
            ${{ needs.pre-deployment.outputs.terraform-dir }}/cost-estimate.txt
          retention-days: 30
          
      - name: 💬 Comment PR with plan
        if: github.event_name == 'pull_request' && steps.plan.outputs.exitcode == 2
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const planPath = path.join('${{ needs.pre-deployment.outputs.terraform-dir }}', 'tfplan.txt');
            const plan = fs.readFileSync(planPath, 'utf8');
            
            const comment = `## 🏗️ Terraform Plan - ${{ needs.pre-deployment.outputs.environment }}
            
            \`\`\`hcl
            ${plan.slice(0, 65000)}
            \`\`\`
            
            **Environment:** ${{ needs.pre-deployment.outputs.environment }}
            **Plan Status:** ${{ steps.plan.outputs.exitcode == 2 && 'Changes detected' || 'No changes' }}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ================================
  # TERRAFORM APPLY
  # ================================
  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: [pre-deployment, terraform-plan]
    if: |
      needs.pre-deployment.outputs.terraform-action == 'apply' &&
      (needs.terraform-plan.outputs.plan-exitcode == '0' || needs.terraform-plan.outputs.plan-exitcode == '2')
    environment: ${{ needs.pre-deployment.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ needs.pre-deployment.outputs.terraform-dir }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 📥 Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.pre-deployment.outputs.environment }}
          path: ${{ needs.pre-deployment.outputs.terraform-dir }}
          
      - name: ⚙️ Terraform Init
        run: terraform init -input=false
        
      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying Terraform plan..."
          
          if [[ "${{ needs.terraform-plan.outputs.plan-exitcode }}" == "2" ]]; then
            terraform apply -input=false -auto-approve tfplan
            echo "✅ Infrastructure changes applied successfully"
          else
            echo "ℹ️ No changes to apply"
          fi
          
      - name: 📊 Terraform Output
        run: |
          echo "📊 Infrastructure outputs:"
          terraform output -json > terraform-outputs.json
          terraform output
          
      - name: 📊 Upload apply artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-${{ needs.pre-deployment.outputs.environment }}
          path: |
            ${{ needs.pre-deployment.outputs.terraform-dir }}/terraform-outputs.json
          retention-days: 90

  # ================================
  # TERRAFORM DESTROY (Manual only)
  # ================================
  terraform-destroy:
    name: 💥 Terraform Destroy
    runs-on: ubuntu-latest
    needs: [pre-deployment, terraform-validate]
    if: needs.pre-deployment.outputs.terraform-action == 'destroy'
    environment: 
      name: ${{ needs.pre-deployment.outputs.environment }}-destroy
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: ${{ needs.pre-deployment.outputs.terraform-dir }}
    
    steps:
      - name: ⚠️ Destroy Warning
        run: |
          echo "⚠️ WARNING: This will DESTROY all infrastructure in ${{ needs.pre-deployment.outputs.environment }}!"
          echo "🔥 This action is IRREVERSIBLE!"
          echo "⏳ Waiting 30 seconds before proceeding..."
          sleep 30
          
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.pre-deployment.outputs.aws-role }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: ⚙️ Terraform Init
        run: terraform init -input=false
        
      - name: 📋 Terraform Destroy Plan
        run: |
          echo "📋 Creating destroy plan..."
          terraform plan -destroy -input=false -out=destroy-plan
          terraform show -no-color destroy-plan > destroy-plan.txt
          
          echo "💥 Resources to be destroyed:"
          grep -E "# .* will be destroyed" destroy-plan.txt || echo "No resources to destroy"
          
      - name: 💥 Terraform Destroy
        run: |
          echo "💥 Destroying infrastructure..."
          terraform apply -input=false -auto-approve destroy-plan
          echo "✅ Infrastructure destroyed successfully"

  # ================================
  # NOTIFICATION
  # ================================
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [pre-deployment, terraform-apply, terraform-destroy]
    if: always() && (needs.terraform-apply.result != 'skipped' || needs.terraform-destroy.result != 'skipped')
    
    steps:
      - name: 📢 Deployment notification
        run: |
          ACTION="${{ needs.pre-deployment.outputs.terraform-action }}"
          ENV="${{ needs.pre-deployment.outputs.environment }}"
          
          if [[ "$ACTION" == "apply" ]]; then
            if [[ "${{ needs.terraform-apply.result }}" == "success" ]]; then
              echo "🎉 Infrastructure deployment to $ENV completed successfully!"
              echo "✅ Environment: $ENV"
              echo "✅ Action: $ACTION"
              echo "✅ Commit: ${{ github.sha }}"
            else
              echo "❌ Infrastructure deployment to $ENV failed!"
              echo "🔍 Check the logs for more details"
              exit 1
            fi
          elif [[ "$ACTION" == "destroy" ]]; then
            if [[ "${{ needs.terraform-destroy.result }}" == "success" ]]; then
              echo "💥 Infrastructure in $ENV destroyed successfully!"
              echo "✅ Environment: $ENV"
              echo "✅ Action: $ACTION"
              echo "✅ Commit: ${{ github.sha }}"
            else
              echo "❌ Infrastructure destruction in $ENV failed!"
              echo "🔍 Check the logs for more details"
              exit 1
            fi
          fi
