name: 🔍 Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  # ================================
  # BACKEND QUALITY GATES
  # ================================
  backend-quality:
    name: 🐍 Backend Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit safety pytest pytest-cov pytest-asyncio
          
      - name: 🧹 Code formatting check (Ruff)
        run: ruff check . --output-format=github
        
      - name: 🔍 Type checking (MyPy)
        run: mypy . --ignore-missing-imports --show-error-codes
        continue-on-error: true
        
      - name: 🛡️ Security scan (Bandit)
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
        
      - name: 🔒 Dependency security check
        run: safety check --json --output safety-report.json
        continue-on-error: true
        
      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: app/backend/*-report.json
          retention-days: 30

  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
        
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          
      - name: 🗃️ Setup test database
        run: |
          python -c "
          import boto3
          dynamodb = boto3.client('dynamodb', endpoint_url='http://localhost:8000', region_name='us-east-1', aws_access_key_id='fake', aws_secret_access_key='fake')
          # Create test tables here if needed
          "
          
      - name: 🧪 Run unit tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --junitxml=pytest-results.xml
            
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            app/backend/pytest-results.xml
            app/backend/htmlcov/
          retention-days: 30
          
      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: app/backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ================================
  # FRONTEND QUALITY GATES
  # ================================
  frontend-quality:
    name: ⚛️ Frontend Quality & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🧹 Lint check
        run: npm run lint
        
      - name: 🎨 Format check
        run: npm run format:check
        
      - name: 🔍 Type check
        run: npm run type-check
        
      - name: 🛡️ Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  frontend-tests:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🧪 Run unit tests
        run: npm run test:ci
        
      - name: 🏗️ Build check
        run: npm run build
        
      - name: 🎭 Install Playwright
        run: npm run test:e2e:install
        
      - name: 🧪 Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            app/frontend/coverage/
            app/frontend/test-results/
            app/frontend/playwright-report/
          retention-days: 30

  # ================================
  # INFRASTRUCTURE VALIDATION
  # ================================
  infrastructure-validation:
    name: 🏗️ Infrastructure Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          
      - name: 🔍 Terraform Format Check
        run: terraform fmt -check -recursive
        
      - name: ✅ Terraform Validation
        run: |
          cd envs/dev
          terraform init -backend=false
          terraform validate
          
      - name: 🛡️ Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: true
          
      - name: 📊 Upload terraform reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-reports
          path: |
            tfsec-report.json
          retention-days: 30

  # ================================
  # QUALITY GATE SUMMARY
  # ================================
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    needs: 
      - backend-quality
      - backend-tests
      - frontend-quality
      - frontend-tests
      - infrastructure-validation
    
    steps:
      - name: ✅ All quality checks passed
        run: |
          echo "🎉 All quality gates passed successfully!"
          echo "✅ Backend quality & security checks"
          echo "✅ Backend tests with coverage"
          echo "✅ Frontend quality & security checks"
          echo "✅ Frontend tests (unit + E2E)"
          echo "✅ Infrastructure validation"
          echo ""
          echo "🚀 Ready for deployment!"
