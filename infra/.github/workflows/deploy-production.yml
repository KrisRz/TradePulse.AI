name: 🚀 Production Deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy'
        required: true
        type: string
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - canary
          - rolling
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: eu-west-2
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  # ================================
  # PRE-PRODUCTION VALIDATION
  # ================================
  pre-production-validation:
    name: 🔍 Pre-production Validation
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.validate.outputs.release-tag }}
      deployment-strategy: ${{ steps.validate.outputs.deployment-strategy }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}
          
      - name: ✅ Validate release tag
        id: validate
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          STRATEGY="${{ github.event.inputs.deployment_strategy }}"
          
          echo "🏷️ Release tag: $RELEASE_TAG"
          echo "🎯 Deployment strategy: $STRATEGY"
          
          # Validate tag exists
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "❌ Release tag '$RELEASE_TAG' does not exist"
            exit 1
          fi
          
          # Validate tag format (should be v*.*.*)
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Release tag format invalid. Expected: v*.*.* (e.g., v1.0.0)"
            exit 1
          fi
          
          echo "release-tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "deployment-strategy=$STRATEGY" >> $GITHUB_OUTPUT
          
          echo "✅ Release validation passed"

  # ================================
  # PRODUCTION TESTS
  # ================================
  production-tests:
    name: 🧪 Production Tests
    runs-on: ubuntu-latest
    needs: pre-production-validation
    if: ${{ !github.event.inputs.skip_tests }}
    
    steps:
      - name: 📥 Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-production-validation.outputs.release-tag }}
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 🧪 Run critical backend tests
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
          # Run only critical/production tests
          pytest tests/ -m "not slow" -v --tb=short
          
      - name: 🧪 Run critical frontend tests
        working-directory: app/frontend
        run: |
          npm ci
          npm run test:ci
          
      - name: 🏗️ Production build test
        working-directory: app/frontend
        run: |
          npm run build:prod
          
          # Verify build integrity
          if [[ ! -f "dist/index.html" ]]; then
            echo "❌ Production build failed"
            exit 1
          fi
          
          echo "✅ Production build successful"

  # ================================
  # INFRASTRUCTURE DEPLOYMENT
  # ================================
  deploy-infrastructure:
    name: 🏗️ Deploy Production Infrastructure
    runs-on: ubuntu-latest
    needs: [pre-production-validation, production-tests]
    if: always() && (needs.production-tests.result == 'success' || needs.production-tests.result == 'skipped')
    environment: 
      name: production
      url: https://app.tradepulse.ai
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    
    steps:
      - name: 📥 Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-production-validation.outputs.release-tag }}
          
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: ⚙️ Terraform Init
        run: terraform init -input=false
        
      - name: 📋 Terraform Plan
        run: |
          terraform plan -input=false -out=prod-plan
          terraform show -no-color prod-plan > prod-plan.txt
          
          echo "📊 Production plan:"
          head -50 prod-plan.txt
          
      - name: 🚀 Terraform Apply
        run: |
          echo "🚀 Applying production infrastructure..."
          terraform apply -input=false -auto-approve prod-plan
          
          echo "📊 Production outputs:"
          terraform output -json > ../../../prod-outputs.json
          terraform output
          
      - name: 📊 Upload infrastructure outputs
        uses: actions/upload-artifact@v4
        with:
          name: production-infrastructure-${{ needs.pre-production-validation.outputs.release-tag }}
          path: prod-outputs.json
          retention-days: 365

  # ================================
  # BACKEND DEPLOYMENT
  # ================================
  deploy-backend:
    name: 🚀 Deploy Production Backend
    runs-on: ubuntu-latest
    needs: [pre-production-validation, deploy-infrastructure]
    defaults:
      run:
        working-directory: app/backend
    
    steps:
      - name: 📥 Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-production-validation.outputs.release-tag }}
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: 📦 Build production package
        run: |
          echo "📦 Building production Lambda package..."
          
          # Install dependencies
          pip install -r requirements.txt --target ./package
          
          # Copy application code
          cp -r . ./package/
          
          # Remove development files
          find ./package -name "*.pyc" -delete
          find ./package -name "__pycache__" -type d -exec rm -rf {} +
          find ./package -name "tests" -type d -exec rm -rf {} +
          find ./package -name "*.egg-info" -type d -exec rm -rf {} +
          find ./package -name ".pytest_cache" -type d -exec rm -rf {} +
          
          # Create optimized package
          cd package
          zip -r ../backend-prod-${{ needs.pre-production-validation.outputs.release-tag }}.zip . \
            -x "*.git*" "*.coverage*" "*.tox*"
          cd ..
          
          echo "📦 Package size: $(du -h backend-prod-${{ needs.pre-production-validation.outputs.release-tag }}.zip | cut -f1)"
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 🚀 Deploy with strategy: ${{ needs.pre-production-validation.outputs.deployment-strategy }}
        run: |
          STRATEGY="${{ needs.pre-production-validation.outputs.deployment-strategy }}"
          LAMBDA_FUNCTION="tradepulse-prod-api"
          PACKAGE="backend-prod-${{ needs.pre-production-validation.outputs.release-tag }}.zip"
          
          echo "🚀 Deploying backend with $STRATEGY strategy..."
          
          case $STRATEGY in
            "blue-green")
              echo "💙 Blue-Green deployment"
              
              # Create alias for current version
              CURRENT_VERSION=$(aws lambda publish-version \
                --function-name $LAMBDA_FUNCTION \
                --query 'Version' --output text)
              
              # Update function code
              aws lambda update-function-code \
                --function-name $LAMBDA_FUNCTION \
                --zip-file fileb://$PACKAGE
              
              # Wait for update to complete
              aws lambda wait function-updated --function-name $LAMBDA_FUNCTION
              
              # Publish new version
              NEW_VERSION=$(aws lambda publish-version \
                --function-name $LAMBDA_FUNCTION \
                --query 'Version' --output text)
              
              # Update production alias to new version
              aws lambda update-alias \
                --function-name $LAMBDA_FUNCTION \
                --name production \
                --function-version $NEW_VERSION
              
              echo "✅ Blue-Green deployment completed: v$CURRENT_VERSION -> v$NEW_VERSION"
              ;;
              
            "canary")
              echo "🐤 Canary deployment (10% traffic)"
              
              # Update function code
              aws lambda update-function-code \
                --function-name $LAMBDA_FUNCTION \
                --zip-file fileb://$PACKAGE
              
              # Wait for update
              aws lambda wait function-updated --function-name $LAMBDA_FUNCTION
              
              # Publish new version
              NEW_VERSION=$(aws lambda publish-version \
                --function-name $LAMBDA_FUNCTION \
                --query 'Version' --output text)
              
              # Update alias with weighted routing (10% new, 90% old)
              CURRENT_VERSION=$(aws lambda get-alias \
                --function-name $LAMBDA_FUNCTION \
                --name production \
                --query 'FunctionVersion' --output text)
              
              aws lambda update-alias \
                --function-name $LAMBDA_FUNCTION \
                --name production \
                --function-version $NEW_VERSION \
                --routing-config "AdditionalVersionWeights={\"$CURRENT_VERSION\":0.9}"
              
              echo "✅ Canary deployment started: 10% traffic to v$NEW_VERSION"
              ;;
              
            "rolling")
              echo "🔄 Rolling deployment"
              
              # Simple rolling update (immediate switch)
              aws lambda update-function-code \
                --function-name $LAMBDA_FUNCTION \
                --zip-file fileb://$PACKAGE
              
              aws lambda wait function-updated --function-name $LAMBDA_FUNCTION
              
              echo "✅ Rolling deployment completed"
              ;;
          esac

  # ================================
  # FRONTEND DEPLOYMENT
  # ================================
  deploy-frontend:
    name: 🌐 Deploy Production Frontend
    runs-on: ubuntu-latest
    needs: [pre-production-validation, deploy-infrastructure]
    defaults:
      run:
        working-directory: app/frontend
    
    steps:
      - name: 📥 Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-production-validation.outputs.release-tag }}
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
          
      - name: 🏗️ Build production frontend
        run: |
          npm ci
          
          # Set production environment variables
          echo "VITE_API_URL=https://api.tradepulse.ai" >> .env.production
          echo "VITE_ENV=production" >> .env.production
          echo "VITE_VERSION=${{ needs.pre-production-validation.outputs.release-tag }}" >> .env.production
          
          # Build for production
          npm run build:prod
          
          # Remove source maps for production
          find dist/ -name "*.map" -delete
          
          echo "📊 Production build size:"
          du -sh dist/
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 📤 Deploy to production S3
        run: |
          S3_BUCKET="${{ secrets.S3_BUCKET_PROD }}"
          
          echo "📤 Deploying to production S3: $S3_BUCKET"
          
          # Sync assets with long cache
          aws s3 sync ./dist s3://$S3_BUCKET \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json"
          
          # Sync HTML with short cache
          aws s3 sync ./dist s3://$S3_BUCKET \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"
          
          echo "✅ Frontend deployed to S3"
          
      - name: 🌐 Invalidate production CloudFront
        run: |
          CF_DISTRIBUTION_ID="${{ secrets.CLOUDFRONT_ID_PROD }}"
          
          echo "🌐 Invalidating CloudFront: $CF_DISTRIBUTION_ID"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "🔄 Invalidation created: $INVALIDATION_ID"
          
          # Wait for invalidation to complete
          aws cloudfront wait invalidation-completed \
            --distribution-id $CF_DISTRIBUTION_ID \
            --id $INVALIDATION_ID
          
          echo "✅ CloudFront invalidation completed"

  # ================================
  # POST-DEPLOYMENT VALIDATION
  # ================================
  production-validation:
    name: ✅ Production Validation
    runs-on: ubuntu-latest
    needs: [pre-production-validation, deploy-backend, deploy-frontend]
    
    steps:
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 🔍 Health checks
        run: |
          echo "🔍 Running production health checks..."
          
          # Test main application
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://app.tradepulse.ai/" || echo "000")
          
          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "✅ Frontend health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Frontend health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          
          # Test API health endpoint
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.tradepulse.ai/health" || echo "000")
          
          if [[ "$API_STATUS" == "200" ]]; then
            echo "✅ API health check passed (HTTP $API_STATUS)"
          else
            echo "❌ API health check failed (HTTP $API_STATUS)"
            exit 1
          fi
          
      - name: 🚀 Performance validation
        run: |
          echo "🚀 Validating production performance..."
          
          # Measure response times
          FRONTEND_TIME=$(curl -s -o /dev/null -w "%{time_total}" "https://app.tradepulse.ai/" || echo "0")
          API_TIME=$(curl -s -o /dev/null -w "%{time_total}" "https://api.tradepulse.ai/health" || echo "0")
          
          echo "⏱️ Frontend response time: ${FRONTEND_TIME}s"
          echo "⏱️ API response time: ${API_TIME}s"
          
          # Validate performance thresholds
          if (( $(echo "$FRONTEND_TIME < 2.0" | bc -l) )); then
            echo "✅ Frontend performance acceptable"
          else
            echo "⚠️ Frontend performance degraded"
          fi
          
          if (( $(echo "$API_TIME < 1.0" | bc -l) )); then
            echo "✅ API performance acceptable"
          else
            echo "⚠️ API performance degraded"
          fi

  # ================================
  # CANARY PROMOTION (if canary deployment)
  # ================================
  promote-canary:
    name: 🐤➡️🚀 Promote Canary
    runs-on: ubuntu-latest
    needs: [pre-production-validation, deploy-backend, production-validation]
    if: needs.pre-production-validation.outputs.deployment-strategy == 'canary' && needs.production-validation.result == 'success'
    environment:
      name: production-canary-promotion
      url: https://app.tradepulse.ai
    
    steps:
      - name: ⏳ Wait for manual approval
        run: |
          echo "🐤 Canary deployment is running with 10% traffic"
          echo "⏳ Waiting for manual approval to promote to 100%..."
          echo "📊 Monitor metrics and approve when ready"
          
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: 🚀 Promote canary to 100%
        run: |
          LAMBDA_FUNCTION="tradepulse-prod-api"
          
          echo "🚀 Promoting canary to 100% traffic..."
          
          # Get current version from alias
          NEW_VERSION=$(aws lambda get-alias \
            --function-name $LAMBDA_FUNCTION \
            --name production \
            --query 'FunctionVersion' --output text)
          
          # Update alias to route 100% traffic to new version
          aws lambda update-alias \
            --function-name $LAMBDA_FUNCTION \
            --name production \
            --function-version $NEW_VERSION
          
          echo "✅ Canary promoted to 100% traffic (version $NEW_VERSION)"

  # ================================
  # NOTIFICATION
  # ================================
  notify-success:
    name: 📢 Production Deployment Success
    runs-on: ubuntu-latest
    needs: [pre-production-validation, production-validation, promote-canary]
    if: always() && needs.production-validation.result == 'success'
    
    steps:
      - name: 🎉 Success notification
        run: |
          echo "🎉 Production deployment completed successfully!"
          echo "🏷️ Release: ${{ needs.pre-production-validation.outputs.release-tag }}"
          echo "🎯 Strategy: ${{ needs.pre-production-validation.outputs.deployment-strategy }}"
          echo "🌐 Frontend: https://app.tradepulse.ai"
          echo "🔗 API: https://api.tradepulse.ai"
          echo "📅 Deployed at: $(date -u)"
          
          # TODO: Send Slack/Teams notification
          # TODO: Update deployment tracking system
          # TODO: Create GitHub release notes

  notify-failure:
    name: 📢 Production Deployment Failure
    runs-on: ubuntu-latest
    needs: [pre-production-validation, production-validation]
    if: always() && needs.production-validation.result == 'failure'
    
    steps:
      - name: ❌ Failure notification
        run: |
          echo "❌ Production deployment failed!"
          echo "🏷️ Release: ${{ needs.pre-production-validation.outputs.release-tag }}"
          echo "🎯 Strategy: ${{ needs.pre-production-validation.outputs.deployment-strategy }}"
          echo "🔍 Check logs for details"
          echo "🚨 IMMEDIATE ATTENTION REQUIRED"
          
          # TODO: Send urgent Slack/Teams notification
          # TODO: Trigger rollback procedure
          # TODO: Create incident ticket
          
          exit 1
