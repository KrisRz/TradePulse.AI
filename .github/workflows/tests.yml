name: Tests (backtesting + paper trading)

on:
  push:
    branches: [main, "improvements/**"]
    paths:
      - "app/backend/backtesting/**"
      - "app/backend/paper_trading/**"
      - "app/backend/tests/test_backtesting.py"
      - "app/backend/tests/test_paper_trading.py"
      - "app/backend/tests/test_paper_bot.py"
      - "app/backend/tests/test_state_store.py"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test deps
        # The backtesting/paper_trading packages are deliberately decoupled from
        # TensorFlow/boto3/FastAPI, so tests need only these lightweight libs.
        run: pip install "numpy>=1.23,<2.0" "pandas>=2.2.3" requests pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Scoped to the dependency-light suites (no TF/boto3/FastAPI needed).
        # Full-stack suites (test_container, test_startup, test_l5_contract,
        # test_fast_diagnostics) run locally where the heavy deps exist.
        run: >
          pytest app/backend/tests/test_backtesting.py
          app/backend/tests/test_paper_trading.py
          app/backend/tests/test_paper_bot.py
          app/backend/tests/test_state_store.py -q
