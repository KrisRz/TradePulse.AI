name: TradePulse.AI - Professional AWS Deployment

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      terraform_action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy
      force_deploy:
        description: 'Force deployment (ignore change detection)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: 1.6.0
  PYTHON_VERSION: '3.11'
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  FORCE_COLOR: 0

jobs:
  # Pre-flight checks and change detection
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.changes.outputs.should-deploy }}
      backend-changed: ${{ steps.changes.outputs.backend-changed }}
      infrastructure-changed: ${{ steps.changes.outputs.infrastructure-changed }}
      frontend-changed: ${{ steps.changes.outputs.frontend-changed }}
      terraform-action: ${{ steps.action.outputs.terraform-action }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changes
        id: changes
        run: |
          echo "🔍 Analyzing changes..."
          
          # Force deployment if requested
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "backend-changed=true" >> $GITHUB_OUTPUT
            echo "infrastructure-changed=true" >> $GITHUB_OUTPUT
            echo "frontend-changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Force deployment requested"
            exit 0
          fi
          
          # Detect actual changes
          BACKEND_CHANGED=false
          INFRA_CHANGED=false
          FRONTEND_CHANGED=false
          
          if git diff --name-only HEAD~1 HEAD | grep -E '^app/backend/' > /dev/null; then
            BACKEND_CHANGED=true
            echo "📦 Backend changes detected"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E '^infra/' > /dev/null; then
            INFRA_CHANGED=true
            echo "🏗️ Infrastructure changes detected"
          fi
          
          if git diff --name-only HEAD~1 HEAD | grep -E '^app/frontend/' > /dev/null; then
            FRONTEND_CHANGED=true
            echo "🎨 Frontend changes detected"
          fi
          
          # Set outputs
          echo "backend-changed=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
          echo "infrastructure-changed=$INFRA_CHANGED" >> $GITHUB_OUTPUT
          echo "frontend-changed=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
          
          if [[ "$BACKEND_CHANGED" == "true" || "$INFRA_CHANGED" == "true" || "$FRONTEND_CHANGED" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deployment needed"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ No deployment needed"
          fi

      - name: Determine Terraform Action
        id: action
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "terraform-action=${{ github.event.inputs.terraform_action }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "terraform-action=plan" >> $GITHUB_OUTPUT
          else
            echo "terraform-action=apply" >> $GITHUB_OUTPUT
          fi

      - name: Validate Repository Structure
        run: |
          echo "🔍 Validating repository structure..."
          
          # Check required directories
          required_dirs=("app/backend" "app/frontend" "infra/terraform")
          for dir in "${required_dirs[@]}"; do
            if [[ ! -d "$dir" ]]; then
              echo "❌ Required directory missing: $dir"
              exit 1
            fi
          done
          
          # Check required files
          required_files=(
            "app/backend/requirements.txt"
            "app/backend/lambda_handler.py"
            "infra/terraform/environments/production/main.tf"
            "infra/terraform/environments/staging/main.tf"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done
          
          echo "✅ Repository structure validated"

  # Build backend Lambda packages
  build-backend:
    name: Build Backend Lambda Packages
    runs-on: ubuntu-latest
    needs: pre-flight
    if: needs.pre-flight.outputs.backend-changed == 'true' || needs.pre-flight.outputs.should-deploy == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          pip install --upgrade pip
          pip install wheel setuptools

      - name: Build Lambda Packages
        working-directory: app/backend
        run: |
          echo "🏗️ Building Lambda packages for AWS deployment..."
          
          # Clean previous builds
          rm -rf lambda_package build_temp *.zip
          mkdir -p lambda_package build_temp
          
          echo "📦 Installing Python dependencies for AWS Lambda..."
          pip install -r requirements.txt \
            --target lambda_package \
            --platform linux_x86_64 \
            --implementation cp \
            --python-version ${{ env.PYTHON_VERSION }} \
            --only-binary=:all: \
            --upgrade \
            --no-deps || pip install -r requirements.txt --target lambda_package --upgrade
          
          echo "📂 Copying application code..."
          cp -r app/ lambda_package/
          cp *.py lambda_package/ 2>/dev/null || true
          
          # Copy optional directories if they exist
          for dir in core models schemas services utils; do
            if [[ -d "$dir" ]]; then
              cp -r "$dir" lambda_package/
            fi
          done
          
          cd lambda_package
          
          echo "🗜️ Creating Lambda deployment packages..."
          
          # Create all Lambda function packages
          lambda_functions=(
            "backend-lambda"
            "ai-signals-lambda" 
            "data-collector-lambda"
            "position-monitor-lambda"
            "health-monitor-lambda"
            "ml-model-updater-lambda"
          )
          
          for func in "${lambda_functions[@]}"; do
            echo "Creating $func.zip..."
            zip -r ../$func.zip . \
              -x "*.pyc" \
              "*/__pycache__/*" \
              "tests/*" \
              "*.git*" \
              "*.DS_Store*" \
              > /dev/null
          done
          
          cd ..
          echo "✅ Lambda packages created:"
          ls -lh *.zip

      - name: Upload Lambda Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages-${{ github.sha }}
          path: app/backend/*.zip
          retention-days: 7

  # Build frontend (if changed)
  build-frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: pre-flight
    if: needs.pre-flight.outputs.frontend-changed == 'true' || needs.pre-flight.outputs.should-deploy == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: app/frontend
        run: |
          echo "🎨 Building frontend assets..."
          npm run build
          
          echo "✅ Frontend build completed:"
          ls -la dist/

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: app/frontend/dist/
          retention-days: 7

  # Terraform plan/apply/destroy
  terraform:
    name: Terraform ${{ needs.pre-flight.outputs.terraform-action }}
    runs-on: ubuntu-latest
    needs: [pre-flight, build-backend]
    if: needs.pre-flight.outputs.should-deploy == 'true' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    outputs:
      api-endpoint: ${{ steps.export.outputs.api_endpoint }}
      cloudfront-domain: ${{ steps.export.outputs.cloudfront_domain }}
      cloudfront-distribution-id: ${{ steps.export.outputs.cloudfront_distribution_id }}
      frontend-bucket: ${{ steps.export.outputs.frontend_bucket }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Authentication
        run: |
          echo "🔐 Verifying AWS authentication..."
          aws sts get-caller-identity
          echo "✅ AWS authentication successful"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Lambda Packages
        if: needs.pre-flight.outputs.backend-changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages-${{ github.sha }}
          path: app/backend/

      - name: Prepare Terraform Working Directory
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "🏗️ Preparing Terraform..."
          
          # Ensure Lambda packages exist (create empty ones if needed for plan-only)
          lambda_packages=(
            "backend-lambda.zip"
            "ai-signals-lambda.zip"
            "data-collector-lambda.zip"
            "position-monitor-lambda.zip"
            "health-monitor-lambda.zip"
            "ml-model-updater-lambda.zip"
          )
          
          for package in "${lambda_packages[@]}"; do
            if [[ ! -f "../../../app/backend/$package" ]]; then
              echo "Creating placeholder for $package"
              touch "../../../app/backend/$package"
            fi
          done

      - name: Terraform Init
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "🏗️ Initializing Terraform..."
          terraform init
          terraform version

      - name: Terraform Validate
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "✅ Validating Terraform configuration..."
          terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "📋 Creating Terraform execution plan..."
          terraform plan \
            -var="environment=${{ github.event.inputs.environment || 'production' }}" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: ${{ needs.pre-flight.outputs.terraform-action != 'apply' }}

      - name: Terraform Apply
        if: needs.pre-flight.outputs.terraform-action == 'apply' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve tfplan
          echo "✅ Infrastructure deployment completed!"

      - name: Terraform Destroy
        if: needs.pre-flight.outputs.terraform-action == 'destroy' && github.event_name == 'workflow_dispatch'
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "💥 Destroying infrastructure..."
          terraform destroy \
            -var="environment=${{ github.event.inputs.environment || 'production' }}" \
            -auto-approve
          echo "✅ Infrastructure destroyed!"

      - name: Extract Terraform Outputs
        id: export
        if: needs.pre-flight.outputs.terraform-action == 'apply'
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'production' }}
        run: |
          echo "📊 Extracting deployment information..."
          
          API_ENDPOINT=$(terraform output -raw api_endpoint 2>/dev/null || echo "")
          CLOUDFRONT_DOMAIN=$(terraform output -raw cloudfront_domain 2>/dev/null || echo "")
          CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name 2>/dev/null || echo "")
          
          if [[ -n "$API_ENDPOINT" ]]; then
            echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_ENV
            echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          fi
          if [[ -n "$CLOUDFRONT_DOMAIN" ]]; then
            echo "cloudfront_domain=$CLOUDFRONT_DOMAIN" >> $GITHUB_ENV
            echo "cloudfront_domain=$CLOUDFRONT_DOMAIN" >> $GITHUB_OUTPUT
          fi
          if [[ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "cloudfront_distribution_id=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_ENV
            echo "cloudfront_distribution_id=$CLOUDFRONT_DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          fi
          if [[ -n "$FRONTEND_BUCKET" ]]; then
            echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_ENV
            echo "frontend_bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          fi

  # Post-deployment verification
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [terraform]
    if: needs.terraform.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    env:
      api_endpoint: ${{ needs.terraform.outputs.api-endpoint }}
      cloudfront_domain: ${{ needs.terraform.outputs.cloudfront-domain }}
      cloudfront_distribution_id: ${{ needs.terraform.outputs.cloudfront-distribution-id }}
      frontend_bucket: ${{ needs.terraform.outputs.frontend-bucket }}
    
    steps:
      - name: Health Check API
        run: |
          echo "🏥 Performing deployment verification..."
          
          if [[ -n "${{ env.api_endpoint }}" ]]; then
            API_URL="${{ env.api_endpoint }}"
            echo "Testing API endpoint: $API_URL/health"
            
            # Wait for deployment to be ready
            echo "⏳ Waiting for API to be ready..."
            sleep 30
            
            # Retry health check
            for attempt in {1..10}; do
              echo "Health check attempt $attempt/10..."
              
              if curl -f -s -o /dev/null -w "%{http_code}" "$API_URL/health" | grep -q "200"; then
                echo "✅ API health check passed!"
                
                # Get detailed health info
                HEALTH_RESPONSE=$(curl -s "$API_URL/health" || echo "No response")
                echo "📋 Health response: $HEALTH_RESPONSE"
                break
              else
                echo "❌ Health check failed, retrying in 30s..."
                sleep 30
              fi
              
              if [[ $attempt -eq 10 ]]; then
                echo "💥 API health checks failed after 10 attempts"
                exit 1
              fi
            done
          else
            echo "⚠️ No API endpoint found to verify"
          fi

      - name: Download Frontend Artifacts
        if: env.frontend_bucket != ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend_dist

      - name: Deploy Frontend to S3 and Invalidate CloudFront
        if: env.frontend_bucket != '' && env.cloudfront_distribution_id != ''
        run: |
          echo "🚀 Syncing frontend to S3 bucket: ${{ env.frontend_bucket }}"
          aws s3 sync frontend_dist/ s3://${{ env.frontend_bucket }}/ --delete
          echo "🧹 Invalidating CloudFront: ${{ env.cloudfront_distribution_id }}"
          aws cloudfront create-invalidation --distribution-id ${{ env.cloudfront_distribution_id }} --paths "/*"

      - name: Verify Frontend
        run: |
          if [[ -n "${{ env.cloudfront_domain }}" ]]; then
            FRONTEND_URL="https://${{ env.cloudfront_domain }}"
            echo "Testing frontend: $FRONTEND_URL"
            
            if curl -f -s -o /dev/null "$FRONTEND_URL"; then
              echo "✅ Frontend is accessible!"
            else
              echo "⚠️ Frontend check failed (may still be deploying)"
            fi
          else
            echo "⚠️ No frontend domain found to verify"
          fi

  # Deployment summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-flight, build-backend, terraform, verify-deployment]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "📊 TRADEPULSE.AI DEPLOYMENT SUMMARY"
          echo "====================================="
          echo ""
          echo "🔄 Trigger: ${{ github.event_name }}"
          echo "🌟 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🕐 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "📦 Build Results:"
          echo "  Backend: ${{ needs.build-backend.result }}"
          echo ""
          echo "🏗️ Infrastructure:"
          echo "  Terraform: ${{ needs.terraform.result }}"
          echo "  Action: ${{ needs.pre-flight.outputs.terraform-action }}"
          echo ""
          echo "✅ Verification:"
          echo "  Health Check: ${{ needs.verify-deployment.result }}"
          echo ""
          
          if [[ -n "${{ env.api_endpoint }}" ]]; then
            echo "🔗 Deployed Services:"
            echo "  API: ${{ env.api_endpoint }}"
          fi
          
          if [[ -n "${{ env.cloudfront_domain }}" ]]; then
            echo "  Frontend: https://${{ env.cloudfront_domain }}"
          fi
          
          echo ""
          
          # Determine overall status
          if [[ "${{ needs.terraform.result }}" == "success" && "${{ needs.verify-deployment.result }}" == "success" ]]; then
            echo "🎉 DEPLOYMENT SUCCESSFUL!"
            echo "✅ TradePulse.AI is ready for trading!"
          elif [[ "${{ needs.terraform.result }}" == "success" ]]; then
            echo "⚠️ DEPLOYMENT COMPLETED WITH WARNINGS"
            echo "Infrastructure deployed but verification had issues"
          else
            echo "💥 DEPLOYMENT FAILED!"
            echo "Check the logs above for details"
            exit 1
          fi