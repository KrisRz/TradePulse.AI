# GitLeaks configuration for TradePulse.AI
# Detect secrets in code and git history

title = "TradePulse.AI Secret Detection"

[extend]
# Use default rules as base
useDefault = true

# NOTE (2026-07-16): removed three custom rules that made the scan useless:
# - aws-access-key-id: duplicate of the default ruleset's aws-access-key-id
# - aws-secret-access-key ([0-9a-zA-Z/+]{40}): matched EVERY 40-char string
#   (git SHAs, checksums) — 317 false positives
# - binance-api-key ([0-9a-zA-Z]{64}): matched every sha256 — 108 false
#   positives. A bare 64-alnum regex cannot distinguish a key from a hash;
#   real Binance keys are caught by the default generic-api-key rule when
#   they appear in key=value context.
# Historical findings are baselined in .gitleaksignore (fingerprints only).

[[rules]]
id = "jwt-secret"
description = "JWT Secret Key"
regex = '''jwt[_-]?secret[_-]?key["\s]*[:=]["\s]*[0-9a-zA-Z/+]{32,}'''
tags = ["key", "JWT"]

[[rules]]
id = "database-url"
description = "Database Connection String"
regex = '''(mongodb|mysql|postgresql|dynamodb)://[^\s"']+'''
tags = ["database", "connection"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN [A-Z]+ PRIVATE KEY-----'''
tags = ["key", "private"]

# Allowlist for false positives.
# NOTE: do NOT blanket-allowlist *.md or *test* — that is exactly how live
# keys slipped past this scanner before. Allowlist specific benign values only.
# NOTE: gitleaks expects a SINGLE [allowlist] table ('Allowlist expected a
# map, got slice' when using [[allowlist]]), so all entries live here.
[allowlist]
description = "Consolidated allowlist: example files, workflow/TF references, documented fixtures"
paths = [
    # Example/template env files (contain placeholders only)
    '''.*\.example$''',
    '''.*\.example\.[a-zA-Z]+$''',
    # GitHub Actions workflow files (reference secrets by name only)
    '''\.github/workflows/.*''',
    # Terraform variable references
    '''infra/terraform/.*''',
]
regexes = [
    # Known benign fixtures / documented example secrets
    '''AKIAIOSFODNN7EXAMPLE''',          # AWS-documented example access key
    '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',  # AWS-documented example secret
    '''super_secret_password_123''',     # log-redaction test fixture
    '''local-dev-secret''',              # DynamoDB Local dev placeholder
    '''change-me-generate-a-random''',   # example.env placeholder
    # GitHub Actions / Terraform references (names, not values)
    '''secrets\.[A-Z_]+''',
    '''\$\{\{ secrets\.[A-Z_]+ \}\}''',
    '''var\.[a-zA-Z_]+''',
    '''\$\{var\.[a-zA-Z_]+\}''',
    # Environment variable placeholders
    '''<[A-Z_]+>''',
    '''\$\{[A-Z_]+\}''',
    '''process\.env\.[A-Z_]+''',
    # Common false positives
    '''AKIA[A-Z0-9]{16}.*example''',
    '''sk-[a-zA-Z0-9]{48}.*test''',
    '''xoxb-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}.*sample''',
]
